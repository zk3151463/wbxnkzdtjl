name: 工具箱

on:
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  build_fyne_app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23.x']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: WillAbides/setup-go-faster@v1
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install Fyne CLI
      run: go install fyne.io/fyne/v2/cmd/fyne@latest

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc \
          libgl1-mesa-dev \
          libwayland-dev \
          libx11-dev \
          libxkbcommon-dev \
          xorg-dev \
          xvfb

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install -y golang
        choco install -y vcredist-all

    - name: Build Fyne App
      run: |
        fyne package -os ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'darwin' || 'linux') }} `
          -name "MyFyneApp" `
          -icon icon.png
      if: matrix.os == 'windows-latest'

    - name: Build Fyne App (Linux and macOS)
      run: |
        fyne package -os ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'darwin' || 'linux') }} \
          -name "MyFyneApp" \
          -icon icon.png
      if: matrix.os != 'windows-latest'

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: FyneApp-${{ matrix.os }}
        path: |
          MyFyneApp*
          MyFyneApp.app/
