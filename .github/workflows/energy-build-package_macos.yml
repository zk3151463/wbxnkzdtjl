name: Energy Build and Package MacOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write

jobs:
  macos-amd64-arm64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ macos-13 ]

    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      # 创建基础环境目录 - 不修改
      - name: Config Base Environment
        run: |
          mkdir $RUNNER_WORKSPACE/app
          mkdir $RUNNER_WORKSPACE/app/install

      # 安装 energy cli - 不修改
      - name: Install ENERGY CLI
        run: |
          cd $RUNNER_WORKSPACE/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v

      # MacOSX64 安装开发环境 - 根据情况修改
      - name: Install ENERGY CEF AMD-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all
          energy env

      # 编译和打包 - AMD64
      - name: Build and Package AMD64
        run: |
          # 确保在正确的目录
          echo "当前目录: $(pwd)"
          cd $GITHUB_WORKSPACE
          
          # 检查 energy 环境
          echo "检查 energy 环境..."
          energy env
          
          # 清理并创建构建目录
          rm -rf build
          mkdir -p build/darwin
          
          echo "开始 AMD64 构建..."
          # 显示项目结构
          echo "项目结构："
          ls -la
          
          # 构建项目，添加更多参数以获取详细信息
          energy build -o="wbxnkamd"  --debug
          
          echo "构建完成，检查构建结果..."
          if [ ! -d "build" ]; then
            echo "Error: build 目录不存在"
            exit 1
          fi
          
          echo "构建目录内容："
          ls -la build/darwin
          
          echo "开始打包..."
          # 添加 --debug 参数获取更多打包信息
          energy package -f="wbxnkamd" -o="wbxnkamd" --pkg -v --debug --skip-sign
          
          echo "打包完成，检查输出..."
          ls -la build/darwin
          
          # 查找所有生成的文件
          echo "查找所有生成的文件..."
          find build -type f
          
          # 确保安装目录存在
          mkdir -p "$RUNNER_WORKSPACE/app/install"
          
          # 尝试查找 pkg 文件（不区分大小写）
          echo "查找 pkg 文件..."
          PKG_FILE=$(find . -iname "*.pkg" -type f)
          
          if [ ! -z "$PKG_FILE" ]; then
            echo "找到 pkg 文件: $PKG_FILE"
            cp "$PKG_FILE" "$RUNNER_WORKSPACE/app/install/"
          else
            echo "Error: 未找到 pkg 文件"
            echo "完整目录结构："
            ls -R
            echo "build 目录内容："
            find build -type f -exec ls -l {} \;
            exit 1
          fi

      # MacOSARM64 安装 ARM64 架构
      - name: Install ENERGY CEF ARM-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all --arch=arm64
          energy env

      # 编译和打包 ARM64
      - name: Build and Package ARM64
        run: |
          cd $GITHUB_WORKSPACE
          
          # 检查 energy 环境
          echo "检查 energy 环境..."
          energy env
          
          # 清理并创建构建目录
          rm -rf build
          mkdir -p build/darwin
          
          echo "开始 ARM64 构建..."
          # 显示项目结构
          echo "项目结构："
          ls -la
          
          # 构建项目，添加更多参数以获取详细信息
          energy build -o="wbxnkarm" --arch=arm64  --debug
          
          echo "构建完成，检查构建结果..."
          if [ ! -d "build" ]; then
            echo "Error: build 目录不存在"
            exit 1
          fi
          
          echo "构建目录内容："
          ls -la build/darwin
          
          echo "开始打包..."
          # 添加 --debug 参数获取更多打包信息
          energy package -f="wbxnkarm" -o="wbxnkarm" --pkg -v --debug --skip-sign
          
          echo "打包完成，检查输出..."
          ls -la build/darwin
          
          # 查找所有生成的文件
          echo "查找所有生成的文件..."
          find build -type f
          
          # 确保安装目录存在
          mkdir -p "$RUNNER_WORKSPACE/app/install"
          
          # 尝试查找 pkg 文件（不区分大小写）
          echo "查找 pkg 文件..."
          PKG_FILE=$(find . -iname "*.pkg" -type f)
          
          if [ ! -z "$PKG_FILE" ]; then
            echo "找到 pkg 文件: $PKG_FILE"
            cp "$PKG_FILE" "$RUNNER_WORKSPACE/app/install/"
          else
            echo "Error: 未找到 pkg 文件"
            echo "完整目录结构："
            ls -R
            echo "build 目录内容："
            find build -type f -exec ls -l {} \;
            exit 1
          fi

      # 添加调试信息
      - name: Debug Information
        if: always()
        run: |
          echo "Workspace contents:"
          ls -R $RUNNER_WORKSPACE/wbxnkzdtjl/build
          echo "Install directory contents:"
          ls -R $RUNNER_WORKSPACE/app/install

      - name: Build and Package END
        run: |
          ls -al $RUNNER_WORKSPACE/app/install

      - name: Release Dynamic library # 版本发布上传liblcl二进制
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "../app/install/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}