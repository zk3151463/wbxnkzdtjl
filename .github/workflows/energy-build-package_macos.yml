name: Energy Build and Package MacOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write

jobs:
  macos-amd64-arm64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ macos-13 ]

    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      # 创建基础环境目录 - 不修改
      - name: Config Base Environment
        run: |
          mkdir $RUNNER_WORKSPACE/app
          mkdir $RUNNER_WORKSPACE/app/install

      # 安装 energy cli - 不修改
      - name: Install ENERGY CLI
        run: |
          cd $RUNNER_WORKSPACE/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v

      # MacOSX64 安装开发环境 - 根据情况修改
      - name: Install ENERGY CEF AMD-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all
          energy env

      # 编译和打包 - AMD64
      - name: Build and Package AMD64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          
          # 确保构建目录存在
          mkdir -p build/darwin
          
          energy build -o="wbxnkamd"
          energy package -f="wbxnkamd" -o="wbxnkamd" --pkg
          
          # 确保目标目录存在并使用正确的路径
          mkdir -p "$RUNNER_WORKSPACE/app/install"
          
          # 添加错误检查
          if [ -f "build/darwin/wbxnkamd.pkg" ]; then
            cp "build/darwin/wbxnkamd.pkg" "$RUNNER_WORKSPACE/app/install/"
          else
            echo "Error: wbxnkamd.pkg not found"
            exit 1
          fi

      # MacOSARM64 安装 ARM64 架构
      - name: Install ENERGY CEF ARM-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all --arch=arm64
          energy env

      # 编译和打包 ARM64
      - name: Build and Package ARM64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          rm -rf build
          
          # 确保构建目录存在
          mkdir -p build/darwin
          
          energy build -o="wbxnkarm" --arch=arm64
          energy package -f="wbxnkarm" -o="wbxnkarm" --pkg
          
          # 确保目标目录存在并使用正确的路径
          mkdir -p "$RUNNER_WORKSPACE/app/install"
          
          # 添加错误检查
          if [ -f "build/darwin/wbxnkarm.pkg" ]; then
            cp "build/darwin/wbxnkarm.pkg" "$RUNNER_WORKSPACE/app/install/"
          else
            echo "Error: wbxnkarm.pkg not found"
            exit 1
          fi

      # 添加调试信息
      - name: Debug Information
        if: always()
        run: |
          echo "Workspace contents:"
          ls -R $RUNNER_WORKSPACE/wbxnkzdtjl/build
          echo "Install directory contents:"
          ls -R $RUNNER_WORKSPACE/app/install

      - name: Build and Package END
        run: |
          ls -al $RUNNER_WORKSPACE/app/install

      - name: Release Dynamic library # 版本发布上传liblcl二进制
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "../app/install/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}