name: Energy Build and Package MacOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write

jobs:
  macos-amd64:
    runs-on: macos-13
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      - name: Config Base Environment
        run: |
          mkdir $RUNNER_WORKSPACE/app
          mkdir $RUNNER_WORKSPACE/app/install
          mkdir $RUNNER_WORKSPACE/app/install/amd64

      - name: Install ENERGY CLI
        run: |
          cd $RUNNER_WORKSPACE/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v

      - name: Install ENERGY CEF AMD-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all
          energy env

      - name: Build and Package AMD64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          echo "当前目录: $(pwd)"
          
          energy build -o="漫客工具箱" 
          energy package -f="漫客工具箱" -o="漫客工具箱" --pkg
          
          PKG_PATH="build/darwin/漫客工具箱.pkg"
          if [ -f "$PKG_PATH" ]; then
            mkdir -p build/darwin/temp
            cp "$PKG_PATH" build/darwin/temp/
            cd build/darwin/temp
            zip -r "macamd64.zip" "漫客工具箱.pkg"
            mv "macamd64.zip" "$RUNNER_WORKSPACE/app/install/amd64/"
          else
            echo "Error: pkg 文件不存在：$PKG_PATH"
            find build/darwin -name "*.pkg"
            exit 1
          fi

  macos-arm64:
    runs-on: macos-13
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      - name: Config Base Environment
        run: |
          mkdir $RUNNER_WORKSPACE/app
          mkdir $RUNNER_WORKSPACE/app/install
          mkdir $RUNNER_WORKSPACE/app/install/arm64

      - name: Install ENERGY CLI
        run: |
          cd $RUNNER_WORKSPACE/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v

      - name: Install ENERGY CEF ARM-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all --arch=arm64
          energy env

      - name: Build and Package ARM64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          energy build -o="漫客工具箱" --arch=arm64
          energy package -f="漫客工具箱" -o="漫客工具箱" --pkg
          
          PKG_PATH="build/darwin/漫客工具箱.pkg"
          if [ -f "$PKG_PATH" ]; then
            mkdir -p build/darwin/temp
            cp "$PKG_PATH" build/darwin/temp/
            cd build/darwin/temp
            zip -r "macM1.zip" "漫客工具箱.pkg"
            mv "macM1.zip" "$RUNNER_WORKSPACE/app/install/arm64/"
          else
            echo "Error: ARM64 pkg 文件不存在"
            find build/darwin -name "*.pkg"
            exit 1
          fi

  release:
    needs: [macos-amd64, macos-arm64]
    runs-on: macos-13
    steps:
      - name: Check Install Directory
        run: |
          ls -al $RUNNER_WORKSPACE/app/install

      - name: Release Dynamic library
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "../app/install/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}