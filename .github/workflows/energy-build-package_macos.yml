name: Energy Build and Package MacOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write

jobs:
  macos-amd64-arm64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ macos-13 ]

    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      # 创建基础环境目录 - 不修改
      - name: Config Base Environment
        run: |
          mkdir $RUNNER_WORKSPACE/app
          mkdir $RUNNER_WORKSPACE/app/install
      # 安装 energy cli - 不修改
      - name: Install ENERGY CLI
        run: |
          cd $RUNNER_WORKSPACE/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v
      # MacOSX64 安装开发环境 - 根据情况修改
      - name: Install ENERGY CEF AMD-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all
          energy env
      # 编译和打包 - 根据情况修改
      - name: Build and Package AMD64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          
          echo "当前目录: $(pwd)"
          
          # 构建前检查目录
          echo "构建前目录结构："
          ls -la
          
          energy build -o="wbxnkamd" 
          
          echo "构建后目录结构："
          ls -la
          
          energy package -f="wbxnkamd" -o="wbxnkamd" --pkg
          
          echo "打包后检查 darwin 目录："
          if [ -d "build/darwin" ]; then
            echo "build/darwin 目录存在，内容如下："
            ls -la build/darwin
          else
            echo "Error: build/darwin 目录不存在"
            echo "build 目录内容："
            ls -la build
          fi
          
          # 检查 pkg 文件
          PKG_PATH="$RUNNER_WORKSPACE/wbxnkzdtjl/build/darwin/wbxnkamd.pkg"
          if [ -f "$PKG_PATH" ]; then
            echo "pkg 文件存在：$PKG_PATH"
            mv "$PKG_PATH" "$RUNNER_WORKSPACE/app/install"
          else
            echo "Error: pkg 文件不存在：$PKG_PATH"
            echo "查找所有 pkg 文件："
            find $RUNNER_WORKSPACE/wbxnkzdtjl -name "*.pkg"
            exit 1
          fi
      # MacOSARM64 安装 ARM64 架构 - 根据情况修改
      - name: Install ENERGY CEF ARM-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all --arch=arm64
          energy env
      # 编译和打包, 删除 build 文件夹 - 根据情况修改
      - name: Build and Package ARM64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          rm -rf build
          
          energy build -o="wbxnkM1" --arch=arm64
          energy package -f="wbxnkM1" -o="wbxnkM1" --pkg
          
          mv "$RUNNER_WORKSPACE/wbxnkzdtjl/build/darwin/wbxnkM1.pkg" "$RUNNER_WORKSPACE/app/install"
      - name: Build and Package END
        run: |
          ls -al $RUNNER_WORKSPACE/app/install
      - name: Release Dynamic library # 版本发布上传liblcl二进制
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "../app/install/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}