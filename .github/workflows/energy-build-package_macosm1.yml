name: Energy Build and Package MacOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
      
permissions:
  contents: write

jobs:
  macos-amd64-arm64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ macos-13 ]

    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      # 创建基础环境目录 - 不修改
      - name: Config Base Environment
        run: |
          mkdir $RUNNER_WORKSPACE/app
          mkdir $RUNNER_WORKSPACE/app/install
      # 安装 energy cli - 不修改
      - name: Install ENERGY CLI
        run: |
          cd $RUNNER_WORKSPACE/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v
     
      # MacOSARM64 安装 ARM64 架构
      - name: Install ENERGY CEF ARM-64
        run: |
          cd $RUNNER_WORKSPACE/app
          energy install --all --arch=arm64
          energy env
      # 编译和打包 ARM64
      - name: Build and Package ARM64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          rm -rf build
          
          energy build -o="漫客工具箱" --arch=arm64
          energy package -f="漫客工具箱" -o="漫客工具箱" --pkg
          
          # 检查并打包 ARM64 pkg 文件
          PKG_PATH="build/darwin/漫客工具箱.pkg"
          if [ -f "$PKG_PATH" ]; then
            # 创建临时目录用于打包
            mkdir -p build/darwin/temp
            cp "$PKG_PATH" build/darwin/temp/
            cd build/darwin/temp
            # 将 pkg 打包成 zip
            zip -r "macM1.zip" "漫客工具箱.pkg"
            mv "macM1.zip" "$RUNNER_WORKSPACE/app/install/"
          else
            echo "Error: ARM64 pkg 文件不存在"
            find build/darwin -name "*.pkg"
            exit 1
          fi
      - name: Build and Package END
        run: |
          ls -al $RUNNER_WORKSPACE/app/install
      - name: Release Dynamic library # 版本发布上传liblcl二进制
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "../app/install/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}