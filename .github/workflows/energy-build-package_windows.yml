name: Energy Build and Package Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows-64:
    runs-on: ${{ matrix.operating-system }}

    strategy:
      matrix:
        operating-system: [ windows-2019 ]
        
    env:
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.20'

      # 创建基础环境目录 - 不修改
      - name: Config Base Environment
        run: |
          mkdir D:/app
          mkdir D:/app/install
        shell: bash

      # 安装 energy cli - 不修改
      - name: Install ENERGY CLI
        run: |
          cd D:/app
          git clone https://github.com/energye/energy.git
          cd energy/cmd/energy
          go install
          energy cli -v
        shell: bash

      # windows 64 安装开发环境, --cef=109 版本号改成你使用的
      - name: Install ENERGY CEF 109-64
        run: |
          cd D:/app
          energy install --all --cef=109
          energy env
        shell: bash

      # cli 编译和打包, -o -f 改成你自己的
      - name: Build and Package AMD64
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          
          energy build -o="漫客工具箱.exe"
          energy package -f="漫客工具箱.exe" -o="漫客工具箱.exe" -c
          
          # 创建临时目录用于打包
          mkdir -p build/windows/temp
          cp "build/windows/漫客工具箱.exe" build/windows/temp/
          
          # 进入临时目录打包
          cd build/windows/temp
          # 将 exe 打包成 zip
          zip -r "winamd64.zip" "漫客工具箱.exe"
          mv "winamd64.zip" "D:/app/install/"
        shell: bash

      # windows 32 安装开发环境, --cef=109 版本号改成你使用的
      - name: Install ENERGY CEF 109-32
        run: |
          cd D:/app
          energy install --all --cef=109 --arch=386
          energy env
        shell: bash

      # cli 编译和打包, -o -f 改成你自己的
      - name: Build and Package 32
        run: |
          cd $RUNNER_WORKSPACE/wbxnkzdtjl
          
          energy build -o="漫客工具箱.exe" --arch="386"
          energy package -f="漫客工具箱.exe" -o="漫客工具箱.exe" -c
          
          # 创建临时目录用于打包
          mkdir -p build/windows/temp
          cp "build/windows/漫客工具箱.exe" build/windows/temp/
          
          # 进入临时目录打包
          cd build/windows/temp
          # 将 exe 打包成 zip
          zip -r "win32.zip" "漫客工具箱.exe"
          mv "win32.zip" "D:/app/install/"
        shell: bash

      - name: Build and Package END
        run: |
          ls -al D:/app/install/
        shell: bash

      # 发布版本自动上传到发布版本, 不需要修改, 但需要配置 GITHUB_TOKEN
      - name: Release Dynamic library
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: D:/app/install/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

